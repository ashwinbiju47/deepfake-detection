; Supervisord for the single-container deployment (Hugging Face Spaces).
; Runs the in-container Redis broker, the Celery worker, and Daphne (ASGI:
; HTTP + WebSocket on port 7860, the port HF Spaces exposes).

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery]
command=celery -A config worker --loglevel=info
directory=/app/backend
autorestart=true
environment=DJANGO_SETTINGS_MODULE="config.settings"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:daphne]
command=daphne -b 0.0.0.0 -p 7860 config.asgi:application
directory=/app/backend
autorestart=true
environment=DJANGO_SETTINGS_MODULE="config.settings"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0